<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Reading Focus">
  <defs>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4e9ee0"/>
      <stop offset="1" stop-color="#9e70da"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f8fb"/>
      <stop offset="1" stop-color="#c8d3e2"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#131a24"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="#2a3646" stroke-width="3"/>
  <g fill="url(#ink)" opacity=".55">
    <rect x="112" y="148" width="288" height="18" rx="9"/>
    <rect x="112" y="346" width="288" height="18" rx="9"/>
  </g>
  <g filter="url(#glow)">
    <rect x="92" y="238" width="328" height="36" rx="18" fill="#f0b633"/>
  </g>
  <g opacity=".9">
    <rect x="112" y="196" width="196" height="18" rx="9" fill="url(#ramp)"/>
    <rect x="112" y="298" width="256" height="18" rx="9" fill="url(#ramp)"/>
  </g>
</svg>
